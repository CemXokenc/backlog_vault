{% extends "base.html" %}

{% block title %}Activation link is not valid{% endblock %}

{% block content %}
  <div class="text-center py-5">
    <div class="auth-icon"><i class="bi bi-link-45deg"></i></div>
    <h1 class="h3 mt-3">This activation link is not valid</h1>
    <p class="text-body-secondary">
      It may have been used already or it has expired.
      If your account is still inactive, ask a moderator to activate it.
    </p>
    <a class="btn btn-primary" href="{% url 'login' %}">Go to login</a>
  </div>
{% endblock %}
