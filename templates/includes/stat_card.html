<div class="col-6 col-lg-{{ cols|default:3 }}">
  <div class="card h-100 text-center stat-tile">
    <div class="card-body">
      <span class="stat-icon"><i class="bi bi-{{ icon }}"></i></span>
      <div class="display-6 fw-semibold">{{ value }}</div>
      <div class="text-body-secondary">{{ label }}</div>
    </div>
  </div>
</div>
