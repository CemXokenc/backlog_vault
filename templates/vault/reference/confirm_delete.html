{% extends "base.html" %}

{% block title %}Delete {{ ref.title|lower }}{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card shadow-sm border-danger">
        <div class="card-body p-4">
          <div class="form-header">
            <span class="page-icon page-icon-danger"><i class="bi bi-exclamation-triangle"></i></span>
            <div>
              <h1>Delete {{ ref.title|lower }}</h1>
            </div>
          </div>
          <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
          <p class="text-body-secondary small">
            {{ object.games.count }} game(s) {{ ref.delete_hint }}
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="form-actions">
              <button type="submit" class="btn btn-danger">Yes, delete</button>
              <a class="btn btn-outline-secondary" href="{{ ref.list_url }}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
